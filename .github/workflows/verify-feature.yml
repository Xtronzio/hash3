name: 'HASH3 Verify feature'
on:
  push:
    branches:
      - feature/3-11-territorio-vivo
      - release/local-diagnostics
      - release/local-territory-r32
      - release/local-visual-r33
      - release/local-ecology-r34
      - release/local-living-r35
      - release/local-symbols-r36
      - release/local-evolution-r37
      - release/local-reclaim-r38
      - release/local-strategy-r39
      - release/local-layout-r40
      - release/local-controls-r41
      - release/local-targets-r42
      - release/local-descriptions-r43
      - release/local-economy-r44
      - release/local-refill-r45
      - release/local-refill-r46
      - release/local-presentation-r47
      - release/local-feedback-r48
      - release/local-layering-r49
      - release/local-inventory-r50
      - release/local-colors-r51
      - release/local-transfer-r52
      - release/local-brand-trade-r53
      - release/local-value-cap-r54
      - release/local-brand-size-r55
      - release/local-bombs-r56
      - release/local-custom-inventory-r57
      - release/local-immunity-choice-r58
      - release/local-checks-r59
      - release/local-territory-ui-r60
      - release/local-planned-events-r61
      - release/local-fauna-r62
      - release/local-brand-c-r62
      - release/local-paused-machine-r64
      - release/local-territory-guide-r65
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:sql
      - run: npm run simulate:turns -- --quick > /dev/null
      - run: npm run simulate:ecology -- --quick > /dev/null
      - run: npm run build:github
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 3
      - run: npx playwright install firefox
        timeout-minutes: 3
      - run: npx playwright install --with-deps webkit
        timeout-minutes: 4
      - run: node scripts/verify-custom-inventory-r57.mjs
      - run: node scripts/verify-bombs-r56.mjs
      - run: node scripts/verify-brief-ecology-r62.mjs
      - run: node scripts/verify-paused-machine-r64.mjs
      - run: node scripts/verify-territory-presentation-r65.mjs
      - run: npm run verify:brand-trade
      - run: npm run verify:browser
      - run: npm run verify:transfer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: territory-browser-qa
          path: browser-results/
      - name: Package local revision for Pages
        if: startsWith(github.ref, 'refs/heads/release/local-') && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          if ! git diff --cached --quiet; then
            git commit -m "Build Pages for ${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
