name: 'HASH3 Verify feature'
on:
  push:
    branches:
      - feature/3-11-territorio-vivo
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:sql
      - run: npm run simulate:turns -- --quick > /dev/null
      - run: npm run simulate:ecology -- --quick > /dev/null
      - run: npm run build:github
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: territory-browser-qa
          path: browser-results/
