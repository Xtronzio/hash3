name: HASH3 R94 browser diagnostic
on:
  push:
    branches:
      - qa/territory-director-r94
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 3
      - run: npm run verify:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: director-r94-browser-diagnostic
          path: browser-results/
