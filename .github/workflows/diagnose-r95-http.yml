name: HASH3 R95 public HTTP verification
on:
  push:
    branches:
      - qa/territory-growth-r95
permissions:
  contents: read
jobs:
  http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the published R95 revision and its assets
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const base='https://xtronzio.github.io/hash3/',build='20261021-r306',checked=[];
          async function read(path){
           const url=new URL(path,base);url.searchParams.set('verify',build);
           const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(20000)});assert.equal(r.status,200,url.href);
           const body=await r.text();checked.push({url:url.origin+url.pathname,status:r.status,bytes:Buffer.byteLength(body)});return body;
          }
          let version;
          for(let i=0;i<33;i++){
           version=JSON.parse(await read('version.json'));
           if(version.version==='R0.21.95'&&version.build===build)break;
           await new Promise(r=>setTimeout(r,3000));
          }
          assert.deepEqual(version,{version:'R0.21.95',build});
          const html=await read('./');
          const scripts=[...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(m=>m[1]);
          const css=[...html.matchAll(/<link[^>]+href="([^"]+\.css)"/g)].map(m=>m[1]);assert.ok(scripts.length&&css.length);
          const primary=await read(scripts[0]);assert.ok(primary.includes('R0.21.95')&&primary.includes(build));
          const workers=[...new Set([...primary.matchAll(/["'](\/hash3\/assets\/[^"']*worker[^"']*\.js)["']/g)].map(m=>m[1]))];assert.ok(workers.length>=2);
          for(const body of await Promise.all([...css,...workers].map(read)))assert.ok(body.length>1000&&!body.slice(0,100).includes('<html'));
          assert.equal((await read('sw.js')).trimEnd(),"const CACHE='hash3-'+\"/hash3/\"+'-3f05ee84df0f';const BASE=\"/hash3/\";const FILES=[\"/hash3/apple-touch-icon-precomposed.png\",\"/hash3/apple-touch-icon.png\",\"/hash3/assets/assistance-worker-Bu-Msclh.js\",\"/hash3/assets/index-Br-Lawer.js\",\"/hash3/assets/index-DaPWjszC.css\",\"/hash3/assets/machine-worker-Q4nO8wxh.js\",\"/hash3/favicon.ico\",\"/hash3/favicon.png\",\"/hash3/fonts/BarlowCondensed-ExtraBold.ttf\",\"/hash3/fonts/OFL.txt\",\"/hash3/icons/hash3-apple-touch-icon-c1.png\",\"/hash3/icons/hash3-favicon-16-c1.png\",\"/hash3/icons/hash3-favicon-32-c1.png\",\"/hash3/icons/hash3-favicon-48-c1.png\",\"/hash3/icons/hash3-favicon-c1.ico\",\"/hash3/icons/hash3-icon-192-c1.png\",\"/hash3/icons/hash3-icon-512-c1.png\",\"/hash3/icons/hash3-logo-c1.svg\",\"/hash3/icons/hash3-wordmark-c1.svg\",\"/hash3/index.html\",\"/hash3/manifest.webmanifest\"];\nself.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(FILES)).then(()=>self.skipWaiting())));\nself.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('hash3-'+BASE+'-')&&k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));\nself.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(e.request.method!=='GET'||u.origin!==self.location.origin||!u.pathname.startsWith(BASE))return;\nif(u.pathname===BASE+'version.json')return;\nif(e.request.mode==='navigate'){e.respondWith(fetch(e.request).catch(()=>caches.open(CACHE).then(c=>c.match(BASE+'index.html'))));return;}\nif(FILES.includes(u.pathname))e.respondWith(caches.open(CACHE).then(async c=>(await c.match(u.pathname))||fetch(e.request)));});".trimEnd());
          const manifest=JSON.parse(await read('manifest.webmanifest'));assert.equal(new URL(manifest.start_url,base).pathname,'/hash3/');
          const report={at:new Date().toISOString(),commit:'c6aa20c583932eec5f42a36d5634f55718d6a6b2',version,checked};fs.writeFileSync('r95-public-http.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r95-public-http
          path: r95-public-http.json
