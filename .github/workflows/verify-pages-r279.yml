name: Verify published r279
on:
  push:
    branches: [verify/pages-r279]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public version and assets
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://xtronzio.github.io/hash3/';
          async function read(path){
            const response=await fetch(base+path+(path.includes('?')?'&':'?')+'qa='+Date.now(),{signal:AbortSignal.timeout(15000),headers:{'Cache-Control':'no-cache'}});
            assert.equal(response.status,200,path+' HTTP status');
            return response.text();
          }
          const version=JSON.parse(await read('version.json'));
          assert.deepEqual(version,{version:'R0.21.68',build:'20261014-r279'});
          const html=await read('');
          assert.ok(html.includes('index-Drd7R8VG.js'),'New published entry asset');
          const js=await read('assets/index-Drd7R8VG.js');
          assert.ok(js.includes('R0.21.68'));
          assert.ok(js.includes('20261014-r279'));
          console.log('PASS published version and entry asset:',JSON.stringify(version));
          JS
